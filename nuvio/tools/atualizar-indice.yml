name: atualizar-indice

# REGENERA O INDICE ESTATICO DAS FONTES DE PAINEL (blz, spc, ato) E FAZ COMMIT
# NO REPOSITORIO DO PLUGIN — nunca no repositorio do addon.
#
# POR QUE EXISTE: os paineis Xtream nao tem busca (`action=search` devolve so
# `user_info`), ignoram `Range` e nao paginam. O catalogo inteiro do BLZ tem 4,77 MB, o do
# SPC 29,2 MB e o do ATO 11,9 MB — e o runtime do plugin Nuvio CORTA o corpo de qualquer
# resposta em 1 MB (512 KB na quota `limited`). Sem um indice, estas tres fontes nao tem
# como funcionar no plugin. Detalhe e medicao em `nuvio/medicoes.md`.
#
# ESTE ARQUIVO NAO E EXECUTADO NENUM PUBLICADO NESTA TAREFA — ele foi criado para o dono
# colocar no repo do plugin. Troque `REPO_DO_PLUGIN` e `BRANCH` antes de usar.

on:
  schedule:
    # A cada 6 h. O Nuvio faz refresh do repositorio de plugin a cada 6 h tambem, entao
    # um ciclo de 6 h mantem o indice no maximo uma geracao atrasado — que e o prazo
    # aceitavel: conteudo novo no painel aparece em ate 6 h.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      alvo:
        description: "Alvo por shard em KB (default 400)"
        required: false
        default: "400"

# `contents: write` porque o commit vai para o repo do PLUGIN, nao para o repo deste
# workflow. Sem `pull-requests`, o commit vai direto na branch (com force na data) para nao
# abrir PR a cada 6 h.
permissions:
  contents: write

concurrency:
  group: indice-painel
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checar o repositorio do plugin
        env:
          REPO_DO_PLUGIN: ${{ vars.MIRROR_PLUGIN_REPO }}
        run: |
          if [ -z "${REPO_DO_PLUGIN}" ]; then
            echo "::error::defina a variavel de repositorio MIRROR_PLUGIN_REPO (Settings > Secrets and variables > Actions > Variables) com o owner/repo do PLUGIN, ex.: devavmirror/mirror-nuvio"
            exit 1
          fi
          echo "repo do plugin: ${REPO_DO_PLUGIN}"

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.MIRROR_PLUGIN_REPO }}
          path: plugin
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # O plugin nao tem dependencia de runtime (esbuild e so dev), e o gerador so usa
      # `fetch`/`fs`/`path` do Node. Ainda assim o `npm ci` traz o esbuild do package.json
      # para o passo de build nao precisar de rede extra.
      - name: instalar
        working-directory: plugin
        run: npm ci --no-audit --no-fund

      - name: gerar o indice
        working-directory: plugin
        env:
          # Credenciais: o gerador le de `src/scrapers/xtream.js` do REPO DO ADDON. Passe
          # o addon como secret (ele tem os defaults em texto, mas o dono pode querer
          # sobrescrever por env). Sem isto, usa os defaults do proprio arquivo.
          MIRROR_ADDON_REPO: ${{ vars.MIRROR_ADDON_REPO }}
        run: |
          if [ -n "${MIRROR_ADDON_REPO}" ]; then
            git clone --depth 1 "https://github.com/${MIRROR_ADDON_REPO}.git" ../addon
            node tools/gerar-indice.js --addon=../addon 2>&1 | tee indice.log
          else
            echo "::warning::MIRROR_ADDON_REPO vazio — o gerador usa os credenciais por default que estao em src/scrapers/xtream.js"
            node tools/gerar-indice.js 2>&1 | tee indice.log
          fi
          echo "### resultado" >> "$GITHUB_STEP_SUMMARY"
          cat indice.log >> "$GITHUB_STEP_SUMMARY"

      - name: conferir o resultado
        working-directory: plugin
        run: |
          node -e '
          const fs = require("fs");
          const idx = JSON.parse(fs.readFileSync("public/idx/indice.json", "utf8"));
          const teto = idx.alvoBytes;
          let maior = { chave: "-", bytes: 0 };
          for (const f of Object.keys(idx.fontes)) {
            const m = idx.fontes[f].maiorShard;
            if (m.bytes > maior.bytes) maior = { chave: `${f}/${m.chave}`, bytes: m.bytes };
          }
          const alvoMB = (teto / 1048576).toFixed(2);
          const maiorMB = (maior.bytes / 1048576).toFixed(2);
          console.log(`itens: ${idx.totalItens} | maior shard: ${maior.chave} ${maiorMB} MB (alvo ${alvoMB} MB)`);
          // O runtime corta em 1 MB. Passar disso NAO quebra o plugin (so o shard fica
          // grande), mas o shard nao abre no aparelho. O job falha para o dono ver.
          if (maior.bytes > 1048576) {
            console.error(`ERRO: shard ${maior.chave} tem ${maiorMB} MB e nao cabe no teto de 1 MB do runtime do Nuvio.`);
            console.error("Aumente o alvo (`--alvo=`) ou reveja a regra de sharding em tools/gerar-indice.js.");
            process.exit(1);
          }
          if (!idx.totalItens) {
            console.error("ERRO: indice com zero itens — os paineis podem estar fora do ar.");
            process.exit(1);
          }
          '

      - name: build dos plugins
        working-directory: plugin
        run: npm run build

      - name: commit
        working-directory: plugin
        env:
          BRANCH: ${{ vars.MIRROR_PLUGIN_BRANCH }}
        run: |
          BRANCH="${BRANCH:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `public/` e a raiz que o Nuvio le (manifest.json + <fonte>.js + idx/); `dist/`
          # e o build. Os dois vao juntos porque o build agora GERA o manifest.json.
          git add public/ dist/
          if git diff --cached --quiet; then
            echo "indice sem mudanca — nada a commitar"
            exit 0
          fi
          # `date` no corpo e o que diz a idade do indice para quem olhar o historico.
          git commit -m "idx: regenera o indice estatico dos paineis (blz/spc/ato) — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # O indice muda todo ciclo (os paineis mudam todo dia). Force evita conflito
          # quando dois workflows de 6 h se sobrepoem.
          git push --force origin "HEAD:${BRANCH}"