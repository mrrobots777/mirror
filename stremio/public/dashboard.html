<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08080a">
  <meta name="description" content="Mirror — Dashboard de métricas do servidor."><title>Mirror — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080a; --surface: #101014; --surface2: #17171c; --border: rgba(229,9,20,.12);
      --pink: #e50914; --pink-dim: rgba(229,9,20,.1); --pink-glow: rgba(229,9,20,.15);
      --green: #22c55e; --green-dim: rgba(34,197,94,.12);
      --yellow: #eab308; --yellow-dim: rgba(234,179,8,.12);
      --red: #ef4444; --red-dim: rgba(239,68,68,.12);
      --blue: #3b82f6; --blue-dim: rgba(59,130,246,.12);
      --cyan: #06b6d4; --cyan-dim: rgba(6,182,212,.12);
      --text: #f4f4f5; --text2: #a1a1aa; --text3: #71717a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .grid-bg { background-image: linear-gradient(rgba(229,9,20,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(229,9,20,.03) 1px, transparent 1px); background-size: 40px 40px; }

    header { border-bottom: 1px solid var(--border); background: rgba(8,8,10,.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; text-decoration: none; color: var(--text); }
    .logo img { height: 32px; width: 32px; border-radius: 8px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; letter-spacing: .02em; }
    .badge-online { background: var(--green-dim); color: var(--green); }
    .badge-offline { background: var(--red-dim); color: var(--red); }
    .version { font-size: 12px; color: var(--text3); font-family: 'JetBrains Mono', monospace; }

    main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
    .page-title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; color: var(--text); }
    .page-sub { color: var(--text3); font-size: 14px; margin-bottom: 32px; }
    .page-sub span { color: var(--pink); font-weight: 600; }

    .grid { display: grid; gap: 16px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-1 { grid-template-columns: 1fr; }
    @media (max-width: 768px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; position: relative; overflow: hidden; transition: border-color .2s; }
    .card:hover { border-color: rgba(229,9,20,.25); }
    .card-glow { box-shadow: 0 0 60px rgba(229,9,20,.04); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text3); }
    .card-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    .big-number { font-size: 42px; font-weight: 900; letter-spacing: -.03em; line-height: 1; font-family: 'JetBrains Mono', monospace; }
    .big-label { font-size: 13px; color: var(--text3); margin-top: 6px; }
    .big-sub { font-size: 14px; color: var(--text2); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 13px; color: var(--text2); }
    .stat-value { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--text); }

    .bar-wrap { margin-top: 16px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
    .bar-label span:first-child { color: var(--text2); }
    .bar-label span:last-child { color: var(--text3); font-family: 'JetBrains Mono', monospace; }
    .bar-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width .6s cubic-bezier(.4,0,.2,1); position: relative; }
    .bar-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); animation: bar-shine 2s infinite; }
    @keyframes bar-shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .bar-pink { background: linear-gradient(90deg, #8f0009, var(--pink)); }
    .bar-green { background: linear-gradient(90deg, #15803d, var(--green)); }
    .bar-blue { background: linear-gradient(90deg, #1d4ed8, var(--blue)); }
    .bar-yellow { background: linear-gradient(90deg, #a16207, var(--yellow)); }
    .bar-cyan { background: linear-gradient(90deg, #0e7490, var(--cyan)); }

    .ring-wrap { display: flex; align-items: center; justify-content: center; }
    .ring { width: 120px; height: 120px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
    .ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-value { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--text); }
    .ring-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
    .pulse-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .pulse-red { background: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    .refresh-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 3px; background: var(--surface2); z-index: 100; }
    .refresh-fill { height: 100%; background: linear-gradient(90deg, var(--pink), #ff3045); width: 0%; transition: width linear; animation: refresh-progress 5s linear infinite; }
    @keyframes refresh-progress { 0% { width: 0%; } 100% { width: 100%; } }

    .empty { text-align: center; padding: 80px 24px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
    .empty-text { color: var(--text3); font-size: 14px; }

    .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
    .tag-pink { background: var(--pink-dim); color: var(--pink); }
    .tag-green { background: var(--green-dim); color: var(--green); }
    .tag-blue { background: var(--blue-dim); color: var(--blue); }
    .tag-yellow { background: var(--yellow-dim); color: var(--yellow); }
    .tag-cyan { background: var(--cyan-dim); color: var(--cyan); }

    .sparkline { display: flex; align-items: flex-end; gap: 2px; height: 32px; margin-top: 12px; }
    .spark-bar { flex: 1; border-radius: 2px; min-width: 4px; transition: height .3s; }

    footer { border-top: 1px solid var(--border); text-align: center; padding: 24px; font-size: 12px; color: var(--text3); }

    .fade-in { animation: fadeIn .4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="grid-bg">
  <header>
    <div class="header-inner">
      <a href="/install" class="logo">
        <img src="/logo.svg?v=1.0.2" alt="Logo Mirror" width="32" height="32">
        <span>Mirror</span>
      </a>
      <div class="header-right">
        <span id="status-badge" class="badge badge-online"><span class="pulse pulse-green"></span>Online</span>
        <span class="version">v1.0.1</span>
      </div>
    </div>
  </header>

  <main>
    <h1 class="page-title fade-in">Dashboard</h1>
    <p class="page-sub fade-in">Métricas em tempo real do servidor <span>·</span> Atualiza a cada 5s</p>

    <div id="content">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        <p class="empty-text">Carregando métricas...</p>
      </div>
    </div>
  </main>

  <div class="refresh-bar"><div class="refresh-fill"></div></div>

  <footer>Mirror 1.0.1</footer>

  <script>
    const $ = s => document.querySelector(s);
    const content = $('#content');
    let history = { memory: [], relay: [], heap: [] };
    const MAX_HISTORY = 20;

    function fmtUptime(s) {
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + (s % 60) + 's';
    }

    function pct(val, max) { return Math.min(100, Math.round((val / max) * 100)); }
    function barColor(p) { return p > 85 ? 'bar-yellow' : p > 60 ? 'bar-blue' : 'bar-green'; }
    function ringColor(p) { return p > 85 ? 'var(--yellow)' : p > 60 ? 'var(--blue)' : 'var(--green)'; }

    function sparkline(data, color) {
      if (!data.length) return '';
      const max = Math.max(...data, 1);
      return '<div class="sparkline">' + data.map(v =>
        `<div class="spark-bar" style="height:${Math.max(4, (v/max)*100)}%;background:${color};opacity:.7"></div>`
      ).join('') + '</div>';
    }

    function renderRing(value, max, label, unit) {
      const p = pct(value, max);
      const circumference = 2 * Math.PI * 46;
      const offset = circumference - (p / 100) * circumference;
      return `
        <div class="ring-wrap">
          <div class="ring">
            <svg viewBox="0 0 100 100">
              <circle class="ring-bg" cx="50" cy="50" r="46"/>
              <circle class="ring-fill" cx="50" cy="50" r="46"
                stroke="${ringColor(p)}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${offset}"/>
            </svg>
            <div class="ring-center">
              <span class="ring-value">${value}<small style="font-size:12px;color:var(--text3)">${unit}</small></span>
              <span class="ring-label">${label}</span>
            </div>
          </div>
        </div>`;
    }

    function render(data) {
      const m = data.memory || {};
      const r = data.relay || {};
      const red = data.redis || {};
      const sql = data.sqlite || {};
      const cap = data.capacity || {};

      const rssPct = m.rss ? pct(m.rss, 512) : 0;
      const heapPct = m.heap ? pct(m.heap, m.heapTotal || 256) : 0;
      const relayPct = cap.maxRelayStreams ? pct(cap.activeRelayStreams || 0, cap.maxRelayStreams) : 0;
      const scraperPct = cap.scraperSlots ? pct(r.activeFetches || 0, cap.scraperSlots) : 0;

      content.innerHTML = `
        <div class="grid grid-3" style="margin-bottom:16px">
          <div class="card card-glow fade-in">
            <div class="card-header">
              <span class="card-title">Uptime</span>
              <span class="tag tag-green">Ativo</span>
            </div>
            <div class="big-number" style="color:var(--green)">${fmtUptime(data.uptime || 0)}</div>
            <div class="big-label">Desde o último reinício</div>
          </div>

          <div class="card card-glow fade-in" style="animation-delay:.05s">
            <div class="card-header">
              <span class="card-title">Memória RSS</span>
              <span class="tag tag-pink">${m.rss || 0} MB</span>
            </div>
            ${renderRing(m.rss || 0, 512, 'RSS', 'MB')}
            ${sparkline(history.memory, 'var(--pink)')}
          </div>

          <div class="card card-glow fade-in" style="animation-delay:.1s">
            <div class="card-header">
              <span class="card-title">Heap</span>
              <span class="tag tag-blue">${m.heap || 0} / ${m.heapTotal || 0} MB</span>
            </div>
            ${renderRing(m.heap || 0, m.heapTotal || 256, 'Heap', 'MB')}
            ${sparkline(history.heap, 'var(--blue)')}
          </div>
        </div>

        <div class="grid grid-2" style="margin-bottom:16px">
          <div class="card card-glow fade-in" style="animation-delay:.15s">
            <div class="card-header">
              <span class="card-title">Stream Relay</span>
              <span class="tag tag-cyan">${r.activeRelayCount || 0} / ${cap.maxRelayStreams || 5} ativos</span>
            </div>
            <div class="bar-wrap">
              <div class="bar-label"><span>Relay</span><span>${relayPct}%</span></div>
              <div class="bar-track"><div class="bar-fill ${barColor(relayPct)}" style="width:${relayPct}%"></div></div>
            </div>
            ${sparkline(history.relay, 'var(--cyan)')}
            <div class="stat-row" style="margin-top:16px">
              <span class="stat-label">M3U8 Cache</span>
              <span class="stat-value">${r.m3u8CacheSize || 0} entries</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Fetches Ativos</span>
              <span class="stat-value">${r.activeFetches || 0}</span>
            </div>
          </div>

          <div class="card card-glow fade-in" style="animation-delay:.2s">
            <div class="card-header">
              <span class="card-title">Cache SQLite</span>
              <span class="tag tag-yellow">${sql.total || 0} entries</span>
            </div>
            ${renderRing(sql.total || 0, 500, 'Cache', '')}
            <div class="stat-row" style="margin-top:16px">
              <span class="stat-label">Expirados</span>
              <span class="stat-value">${sql.expired || 0}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Hit Rate</span>
              <span class="stat-value">${sql.total ? Math.round(((sql.total - (sql.expired||0)) / sql.total) * 100) : 0}%</span>
            </div>
          </div>
        </div>

        <div class="grid grid-2" style="margin-bottom:16px">
          <div class="card card-glow fade-in" style="animation-delay:.25s">
            <div class="card-header">
              <span class="card-title">Redis</span>
              ${red.connected !== false ? '<span class="tag tag-green"><span class="pulse pulse-green"></span>Conectado</span>' : '<span class="tag tag-yellow">Inativo</span>'}
            </div>
            <div class="stat-row">
              <span class="stat-label">Clientes</span>
              <span class="stat-value">${red.connected_clients || '—'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Memória</span>
              <span class="stat-value">${red.used_memory || '—'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Comandos/s</span>
              <span class="stat-value">${red.instantaneous_ops_per_sec || '—'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Hits</span>
              <span class="stat-value">${red.keyspace_hits || '—'}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Misses</span>
              <span class="stat-value">${red.keyspace_misses || '—'}</span>
            </div>
          </div>

          <div class="card card-glow fade-in" style="animation-delay:.3s">
            <div class="card-header">
              <span class="card-title">Capacidade</span>
              <span class="tag tag-pink">Scrapers</span>
            </div>
            <div class="bar-wrap">
              <div class="bar-label"><span>Scraper Slots</span><span>${r.activeFetches || 0} / ${cap.scraperSlots || 20}</span></div>
              <div class="bar-track"><div class="bar-fill ${barColor(scraperPct)}" style="width:${scraperPct}%"></div></div>
            </div>
            <div class="bar-wrap">
              <div class="bar-label"><span>Rate Limit API</span><span>${cap.rateLimitApi || 30}/min</span></div>
              <div class="bar-track"><div class="bar-fill bar-pink" style="width:30%"></div></div>
            </div>
            <div class="bar-wrap">
              <div class="bar-label"><span>Rate Limit Proxy/HLS</span><span>${cap.rateLimitProxy || 15}/min</span></div>
              <div class="bar-track"><div class="bar-fill bar-cyan" style="width:20%"></div></div>
            </div>
            <div class="bar-wrap">
              <div class="bar-label"><span>Relay Streams</span><span>${cap.activeRelayStreams || 0} / ${cap.maxRelayStreams || 5}</span></div>
              <div class="bar-track"><div class="bar-fill ${barColor(relayPct)}" style="width:${relayPct}%"></div></div>
            </div>
            <div class="stat-row" style="margin-top:12px">
              <span class="stat-label">Janela Rate Limit</span>
              <span class="stat-value">${cap.rateLimitWindow || 60}s</span>
            </div>
          </div>
        </div>

        <div class="grid grid-1">
          <div class="card card-glow fade-in" style="animation-delay:.35s">
            <div class="card-header">
              <span class="card-title">Sistema</span>
              <span class="tag tag-blue">Detalhes</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
              <div class="stat-row"><span class="stat-label">PID</span><span class="stat-value">${data.pid || '—'}</span></div>
              <div class="stat-row"><span class="stat-label">Versão</span><span class="stat-value">${data.version || '1.0.1'}</span></div>
              <div class="stat-row"><span class="stat-label">Nome</span><span class="stat-value">${data.name || 'Mirror'}</span></div>
              <div class="stat-row"><span class="stat-label">Memória External</span><span class="stat-value">${m.external || 0} MB</span></div>
              <div class="stat-row"><span class="stat-label">Heap Total</span><span class="stat-value">${m.heapTotal || 0} MB</span></div>
              <div class="stat-row"><span class="stat-label">Status</span><span class="stat-value" style="color:var(--green)">✓ Online</span></div>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchMetrics() {
      try {
        const [health, metrics] = await Promise.all([
          fetch('/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null),
          fetch('/metrics', { cache: 'no-store' }).then(r => r.ok ? r.json() : null)
        ]);
        if (!health) return;

        const data = { ...health, pid: metrics?.pid };
        if (data.memory) {
          history.memory.push(data.memory.rss);
          history.heap.push(data.memory.heap);
          if (history.memory.length > MAX_HISTORY) history.memory.shift();
          if (history.heap.length > MAX_HISTORY) history.heap.shift();
        }
        if (data.relay) {
          history.relay.push(data.relay.activeRelayCount || 0);
          if (history.relay.length > MAX_HISTORY) history.relay.shift();
        }

        const badge = $('#status-badge');
        badge.className = 'badge badge-online';
        badge.innerHTML = '<span class="pulse pulse-green"></span>Online';

        render(data);
      } catch (e) {
        const badge = $('#status-badge');
        badge.className = 'badge badge-offline';
        badge.innerHTML = '<span class="pulse pulse-red"></span>Offline';
      }
    }

    fetchMetrics();
    setInterval(fetchMetrics, 5000);
  </script>
</body>
</html>
