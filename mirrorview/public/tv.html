<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorView · TV ao vivo</title>
<style>
  :root { --preto:#08080a; --vermelho:#e50914; --cinza:#9a9aa2; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--preto); color:#fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  #video { width:100%; max-width:1100px; background:#000; border-radius:10px; aspect-ratio:16/9; }
  .barra { width:100%; max-width:1100px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:13px; color:var(--cinza); }
  .barra b { color:#fff; font-weight:600; }
  .tag { padding:3px 9px; border:1px solid #26262c; border-radius:999px; font-size:12px; }
  .tag.on { border-color:var(--vermelho); color:#fff; }
  .erro { color:#ff6b6b; font-size:13px; max-width:1100px; word-break:break-all; }
  a { color:var(--vermelho); }
</style>
</head>
<body>
<video id="video" controls playsinline autoplay muted></video>
<div class="barra">
  <b id="nome">Mirror TV</b>
  <span class="tag" id="tag-swarm">P2P: –</span>
  <span class="tag" id="tag-peers">pares: 0</span>
  <span class="tag" id="tag-seg">segmentos: 0</span>
  <span class="tag" id="tag-origem">origem: –</span>
  <span class="tag" id="tag-erros">erros: 0</span>
</div>
<div class="erro" id="erro" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<!-- O P2P (decisao 132). CAUSA RAIZ ACHADA LENDO A DOCUMENTACAO (medido 01/10/2026): a pagina
     usava a API da **v3** — `new p2pml.hlsjs.Engine({loader: ...})` passado como `loader` na
     configuracao do hls.js. Na **v4** isso nao existe: o motor entra por
     `HlsJsP2PEngine.injectMixin(Hls)`, que devolve uma **subclasse** do hls.js, e a
     configuracao vai em `hls.p2p`. Era exatamente o sintoma medido antes ("manifestLoadError,
     status 0"): o hls.js recebia um `loader` que nao era loader nenhum e o manifesto nunca
     completava.
     A v4 tambem e **so ESM** (o guia de migracao diz isso), entao as duas tags de script UMD
     foram trocadas por um import map + um modulo — e a pagina espera esse modulo antes de criar
     o player, senão ela tocaria sem P2P sem avisar. -->
<script type="importmap">
{
  "imports": {
    "p2p-media-loader-core": "https://cdn.jsdelivr.net/npm/p2p-media-loader-core@4.0.0/dist/p2p-media-loader-core.es.min.js",
    "p2p-media-loader-hlsjs": "https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@4.0.0/dist/p2p-media-loader-hlsjs.es.min.js"
  }
}
</script>
<script type="module">
  window.__p2pPronto = import("p2p-media-loader-hlsjs").then(function (m) {
    if (!window.Hls) throw new Error("hls.js nao carregou");
    if (!m.HlsJsP2PEngine || typeof m.HlsJsP2PEngine.injectMixin !== "function") {
      throw new Error("HlsJsP2PEngine.injectMixin ausente");
    }
    return { classe: m.HlsJsP2PEngine.injectMixin(window.Hls) };
  }).catch(function (e) {
    // FALHA VISIVEL: o motivo vai para a tela E para o /health, em vez de a pagina tocar em
    // silencio e ninguem descobrir que o P2P nunca ligou (que era o estado antes).
    return { erro: String((e && e.message) || e).slice(0, 60) };
  });
</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get("src") || "";
  var swarm = q.get("swarm") || "canal";
  var nome = q.get("nome") || swarm;
  var video = document.getElementById("video");
  var el = {
    nome: document.getElementById("nome"), swarm: document.getElementById("tag-swarm"),
    peers: document.getElementById("tag-peers"), seg: document.getElementById("tag-seg"),
    origem: document.getElementById("tag-origem"), erros: document.getElementById("tag-erros"),
    erro: document.getElementById("erro")
  };
  el.nome.textContent = nome;
  document.title = nome + " · Mirror TV";

  if (!src) { el.erro.hidden = false; el.erro.textContent = "Falta o parâmetro src."; return; }
  try { el.origem.textContent = "origem: " + new URL(src).host; } catch (_) {}

  var stats = { total: 0, p2p: 0, peers: 0, erros: 0 };
  var p2p = null;
  // O que o motor esta fazendo, em uma palavra: desligado, ligado, anunciando, registro-falhou
  // ou erro:<motivo>. E o que vai para o /health, e a unica forma de saber se o P2P funciona
  // sem ninguem ter que abrir o console do navegador.
  var motorEstado = "desligado";

  // RELATORIO DO ENXAME (decisao 128). Sem isto nao existe prova de que o P2P funciona: o
  // motor fica atrás de `?p2p=1` e o codigo antigo registra que ele nao completa o manifesto
  // com o hls.js atual. A pagina manda o que ela viu a cada 5s e o `/health` mostra — assim a
  // resposta e medida, e nao opiniao de ninguem.
  function relatar() {
    try {
      fetch("/p2p/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          canal: swarm,
          pares: stats.peers,
          segmentos: stats.total,
          dePares: stats.p2p,
          erros: stats.erros,
          motor: motorEstado
        })
      }).catch(function () {});
    } catch (_) {}
  }
  setInterval(relatar, 5000);
  var TEMPO = 15; // segundos de janela para o percentual

  function marcar(origem) {
    stats.total++;
    if (origem === "p2p") stats.p2p++;
    el.seg.textContent = "segmentos: " + stats.total + " (" + stats.p2p + " de peers)";
    el.swarm.textContent = "P2P: " + (stats.total ? ((stats.p2p / stats.total) * 100).toFixed(0) : "0") + "%";
    el.swarm.classList.toggle("on", stats.p2p > 0);
    el.peers.textContent = "pares: " + stats.peers;
  }

  // O P2P so entra com ?p2p=1 (ou pelo botao). A pagina toca SEM P2P garantido (medido: KAK
  // 1920x1080, EMB 1280x720): o enxame e bonus, e uma pagina que nao abre e pior.
  //
  // API v4 (medido na documentacao oficial em 01/10/2026): `HlsJsP2PEngine.injectMixin(Hls)`
  // devolve uma SUBCLASS do hls.js; os eventos sao lidos em `hls.p2pEngine` e o carregamento
  // vem de par quando `downloadSource === "p2p"`.
  //
  // Trackers: medido em 30/09 que `openwebtorrent` fecha sem responder e `novage.com.ua` da
  // erro de WebSocket; so `webtorrent.dev` respondeu. O tracker da Cloudflare (nosso worker)
  // entra assim que existir a rota /p2p/announce.
  var TRACKERS = ["wss://tracker.webtorrent.dev/announce"];
  var querP2P = q.get("p2p") === "1" && !!window.Hls && window.Hls.isSupported();

  function estadoDoMotor(texto) { el.swarm.textContent = "P2P: " + texto; }

  function ligaEventos(motor) {
    if (!motor || typeof motor.addEventListener !== "function") return;
    motor.addEventListener("onPeerConnect", function () {
      stats.peers++;
      el.peers.textContent = "pares: " + stats.peers;
    });
    motor.addEventListener("onPeerClose", function () {
      stats.peers = Math.max(0, stats.peers - 1);
      el.peers.textContent = "pares: " + stats.peers;
    });
    motor.addEventListener("onSegmentLoaded", function (det) {
      // `downloadSource` e o que separa "veio de par" de "veio da origem" — sem isso o numero
      // de P2P no /health seria chute.
      marcar(det && det.downloadSource === "p2p" ? "p2p" : "http");
    });
    motor.addEventListener("onSegmentError", function () {
      stats.erros++;
      el.erros.textContent = "erros: " + stats.erros;
    });
    // ESTE e o evento que importa: o guia de migracao diz que um stream que nao registra
    // "stays unknown to the core (its segments load without P2P)" e o erro so aparece aqui.
    // Sem escutar, o P2P "liga" e nao serves para nada, em silencio.
    motor.addEventListener("onStreamRegistrationError", function (det) {
      motorEstado = "registro-falhou";
      estadoDoMotor("registro falhou");
      stats.erros++;
    });
    motor.addEventListener("onStreamAdded", function () {
      motorEstado = "anunciando";
      estadoDoMotor("anunciando");
    });
    motor.addEventListener("onTrackerError", function () { stats.erros++; });
  }

  if (video.canPlayType("application/vnd.apple.mpegurl") && !window.Hls) {
    video.src = src;
    video.play().catch(function () {});
    el.seg.textContent = "segmentos: via <video>";
    return;
  }

  var hls = null;

  function criarPlayer(Classe, comP2P) {
    var opcoes = { liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10 };
    if (comP2P) {
      opcoes.p2p = {
        core: { trackerAnnounce: TRACKERS, simultaneousHttpDownloads: 4 },
        onHlsJsCreated: function (h) { ligaEventos(h.p2pEngine); }
      };
    }
    hls = new Classe(opcoes);
    hls.on(Classe.Events.MANIFEST_PARSED, function () { video.play().catch(function () {}); });

  // A playlist do kakito vem com 302 para a origem e o token mora no redirect. O 302 nao
  // traz cache-control, entao o Chrome guarda e pode reaproveitar um token de janela
  // antiga (-> 403 na origem), e o proprio painel as vezes entrega token ja vencido.
  // Por isso: parametro anti-cache (que o painel ignora, medido) e retentativa com token
  // novo. O endereco so muda a cada 5 min, para o enxame nao se desfazer a cada carga.
  var tentativas = 0;
  function carregar() {
    var janela = Math.floor(Date.now() / 300000) + "-" + tentativas;
    hls.loadSource(src + (src.indexOf("?") >= 0 ? "&" : "?") + "_=" + janela);
  }
  hls.on(window.Hls.Events.ERROR, function (_e, data) {
    if (!data || !data.fatal) return;
    stats.erros++;
    el.erros.textContent = "erros: " + stats.erros;
    if (data.details === "manifestLoadError" && tentativas < 3) {
      tentativas++;
      el.erro.hidden = true;
      carregar();
      return;
    }
    el.erro.hidden = false;
    el.erro.textContent = "Falha: " + (data.details || data.type || "erro");
  });
  carregar();
  hls.attachMedia(video);
  }

  // LIGA O PLAYER. Com P2P desligado o player nasce na hora; com P2P ligado ele espera o
  // modulo ESM (decisao 132), porque criar o hls.js antes do motor existir seria voltar ao
  // estado quebrado que a gente media. Se o modulo falhar, a pagina toca DO JEITO e mostra o
  // motivo — nunca uma pagina em branco por causa de bonus.
  (function liga() {
    if (!querP2P) {
      motorEstado = "desligado";
      estadoDoMotor("desligado (botao liga)");
      criarPlayer(window.Hls, false);
      return;
    }
    var promessa = window.__p2pPronto;
    if (!promessa) {
      motorEstado = "erro:modulo ausente";
      estadoDoMotor("modulo ausente");
      criarPlayer(window.Hls, false);
      return;
    }
    estadoDoMotor("carregando motor");
    promessa.then(function (r) {
      if (!r || r.erro || !r.classe) {
        motorEstado = "erro:" + String((r && r.erro) || "sem classe").slice(0, 40);
        estadoDoMotor("indisponivel");
        criarPlayer(window.Hls, false);
        return;
      }
      p2p = r.classe;
      motorEstado = "ligado";
      estadoDoMotor("ligando");
      criarPlayer(r.classe, true);
    });
  })();

  // Renova o TOKEN do painel: um token serve para todos os canais (medido), entao e o
  // unico pedido de que o navegador precisa. Antes a pagina doava a playlist inteira e
  // quebrava por "Mixed Content" (o painel redireciona para http, e pagina https nao
  // carrega http). Pegando so o cabecalho do redirect, nao ha redirecionamento envolvido.
  var base = location.origin;
  function renovarToken() {
    fetch(src, { cache: "no-store", redirect: "manual" })
      .then(function () { throw new Error("veio o corpo, nao o redirect"); })
      .catch(function () { return null; })
      .then(function () {
        // fallback: se o redirect nao pode ser lido no navegador, pede a lista direto
        return fetch(src, { cache: "no-store" }).then(function (r) { return r.text(); });
      })
      .then(function (t) {
        var m = String(t).match(/token=([A-Za-z0-9%+/=_-]+)/);
        if (!m) throw new Error("sem token na resposta");
        return fetch(base + "/api/tv/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: decodeURIComponent(m[1]) }),
        });
      })
      .then(function (r) { return r.json(); })
      .then(function (j) { el.origem.textContent = j && j.ok ? "token: renovado" : "token: recusado"; })
      .catch(function (e) { el.origem.textContent = "token: " + (e.message || "falhou").slice(0, 22); });
  }
  if (q.get("token") !== "0") {
    renovarToken();
    setInterval(renovarToken, 60000);
  }
})();
</script>
</body>
</html>
