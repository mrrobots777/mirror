name: publicar-pages

# PUBLICA O PLUGIN COMO SITE ESTATICO (GitHub Pages) — e' a URL que o dono escreve no
# Nuvio: https://<user>.github.io/<repo>/manifest.json
#
# POR QUE EXISTE: o plugin e' lido pelo Nuvio de um endereco HTTP, entao o proprio repo
# do plugin precisa estar servido. Este workflow gera o que o runtime le (`public/`: o
# `manifest.json` mais os 15 `<fonte>.js`) e o entrega como artefato de Pages.
#
# NAO E' O MESMO QUE `atualizar-indice.yml`: aquele faz commit do indice no repositorio
# (as credenciais dos paineis vivem no repo do ADDON, entao o indice so pode ser gerado
# la). Este aqui so constroi e publica — nenhum commit, nenhum segredo.
#
# RODA NO REPO DO PLUGIN (conta `mrrobots777`, repo `mirror`) — e' ele que publica em
# `https://mrrobots777.github.io/mirror/`. O repositorio do Pages e' `mrrobots777/mirror`
# em modo **workflow** (nao `legacy`), porque o deploy vem do artefato de
# `upload-pages-artifact` e nao de um commit na branch: em `legacy` o Pages serviria a
# branch `gh-pages` e o `manifest.json` nao existiria no ar.
#
# O environment `github-pages` deste repo so aceita deploy pela branch `gh-pages` (regra
# de protecao medida em 02/10/2026): rodar em `master` — por `push` ou por
# `workflow_dispatch` — e' rejeitado com "Branch ... is not allowed to deploy to
# github-pages". O conteudo das duas branches e' o mesmo commit, entao disparar por
# `gh-pages` constroi o mesmo plugin.

on:
  push:
    branches: ["gh-pages", "main", "master"]
  schedule:
    # O MESMO relogio de `tools/atualizar-indice.yml` (minuto 17 a cada 6 h), e pelo
    # mesmo motivo: o Nuvio atualiza o repositorio de plugin a cada 6 h tambem, entao um
    # ciclo de 6 h mantem o plugin publicado no maximo uma geracao atrasado. O `push`
    # cobre o deploy na hora; o `schedule` cobre o indice que mudou no repo do addon.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# MINIMO NECESSARIO: `pages: write` + `id-token: write` sao o que o `deploy-pages`
# exige (o token do deploy sai por OIDC, nao de uma chave guardada) e `contents: write` e o
# que o proprio `configure-pages` usa para ler a configuracao de Pages. Nada de `actions`
# nem de `pull-requests`, e nenhum segredo de repositorio e referenciado aqui.
permissions:
  contents: write
  pages: write
  id-token: write

# Duas publicacoes nao podem disputar o mesmo deploy; uma Cancelando a outra e' o
# comportamento certo aqui (o ultimo build e' o que vale).
concurrency:
  group: publicar-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # O `deploy-pages` exige que o job tenha o environment `github-pages`: sem isso a
    # criacao da deployment volta 400 "Missing environment" (medido 02/10/2026). O
    # environment tambem e o que da o `pages: write` com escopo por environment.
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `esbuild` e devDependency e `build.js` chama `require("esbuild")` logo na
      # primeira linha: sem `npm ci` o build nem comeca.
      - name: instalar
        working-directory: nuvio
        run: npm ci --no-audit --no-fund

      # O gerador le as credenciais dos paineis de `src/scrapers/xtream.js` do repo do
      # ADDON. Numa copia do plugin fora do monorepo esse `../src` nao existe, entao o
      # addon e' clonado. O nome do repo vem de variavel de repositorio (nao e segredo);
      # sem ela o passo avisa e usa o que ja estiver em `public/idx/`.
      - name: gerar o indice estatico
        working-directory: nuvio
        env:
          MIRROR_ADDON_REPO: ${{ vars.MIRROR_ADDON_REPO }}
        run: |
          if [ -n "${MIRROR_ADDON_REPO}" ]; then
            git clone --depth 1 "https://github.com/${MIRROR_ADDON_REPO}.git" ../addon
            node tools/gerar-indice.js --addon=../addon 2>&1 | tee indice.log
          else
            echo "::warning::MIRROR_ADDON_REPO vazia — o gerador usa o catalogo que ja estiver em public/idx/ (rode tools/atualizar-indice.yml no repo do addon para renovar)"
            node tools/gerar-indice.js 2>&1 | tee indice.log || echo "::warning::gerador falhou — segue com o indice que estava no repositorio"
          fi
          echo "### indice" >> "$GITHUB_STEP_SUMMARY"
          cat indice.log >> "$GITHUB_STEP_SUMMARY"

      - name: build do plugin
        working-directory: nuvio
        run: node build.js

      # O build ja copia tudo para `public/`, mas ele ABRA se `public/idx/indice.json`
      # faltar. Publicar um site sem indice e' pior do que falhar aqui: as tres fontes
      # de painel (blz, spc, ato) nao tem como funcionar sem ele.
      - name: conferir o que vai para o Pages
        working-directory: nuvio
        run: |
          node -e '
          const fs = require("fs");
          const precisa = ["manifest.json", "idx/indice.json"];
          const faltando = precisa.filter((f) => !fs.existsSync(`public/${f}`));
          if (faltando.length) {
            console.error(`ERRO: public/ sem ${faltando.join(", ")} — nada publicado.`);
            process.exit(1);
          }
          const idx = JSON.parse(fs.readFileSync("public/idx/indice.json", "utf8"));
          const js = fs.readdirSync("public").filter((n) => n.endsWith(".js"));
          console.log(`manifest.json | ${js.length} scrapers | indice: ${idx.totalItens} itens`);
          '
          echo "### publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la public/ >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      # SO `nuvio/public/` vai como artefato. `dist/`, `src/`, `node_modules/` e
      # `tools/` sao do build e do repositorio, nao do que o Nuvio lê.
      #
      # O CAMINHO PRECISA SER `nuvio/public`, E NAO `public`: este passo NAO tem
      # `working-directory`, entao `public` resolveria a partir da RAIZ do repo — que e'
      # a UI do addon (install.html, dashboard.html, tv.html, logo.svg). Medido
      # 02/10/2026: o deploy passava, o artefato saia com 4 paginas e nenhum
      # `manifest.json`, e o Pages servia 404 em `/manifest.json`. O passo de
      # conferencia nao pegou porque roda com `working-directory: nuvio` e checa
      # `nuvio/public/` — que existe. build.js tambem escreve em `nuvio/public/`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nuvio/public

      - id: publicar
        uses: actions/deploy-pages@v4
