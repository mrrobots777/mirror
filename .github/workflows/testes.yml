name: testes

# CI do Mirror. Roda a cada push nas tres referencias e a cada pedido de PR.
#
# O QUE ESTE ARQUIVO TRAVA (medido 30/09/2026, auditoria): o projeto tinha 202 testes que
# SÓ rodavam quando alguem lembrava (nao havia `.github/workflows`), e nenhuma checagem de
# sintaxe — foi assim que o worker (que e ESM) pode quebrar sem o `node --test` acusar nada,
# ja que o Node CommonJS nao le `export default`.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # 20 = a versao do Dockerfile de producao (beamup constroi com node:20-slim).
      # MEDIDO 02/10/2026: `cache: npm` sem `cache-dependency-path` procuraria o
      # `package-lock.json` na RAIZ — que nao existe desde que o repo virou tres produtos.
      # As duas dependencias ficam declaradas aqui.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            mirrorstream/package-lock.json
            mirrorview/package-lock.json

      # O repo tem TRES produtos: `nuvio/` (plugin), `addon/` (catalogo para o Nuvio)
      # e `stremio/` (addon Stremio). Cada um tem o seu package.json e as suas deps.
      - name: instala as dependencias (mirrorstream)
        run: npm ci --no-audit --no-fund
        working-directory: mirrorstream

      - name: instala as dependencias (mirrorview)
        run: npm ci --no-audit --no-fund
        working-directory: mirrorview

      - name: sintaxe do servidor e do scraper (CommonJS)
        # O worker NAO entra aqui: ele e modulo ESM (`export default`) e o `node -c` do
        # CommonJS nele da SyntaxError. A primeira versao deste arquivoincluiu o worker e a
        # propria CI caiu — que e exatamente para isso que ela existe.
        run: |
          set -e
          for produto in mirrorstream mirrorview; do
            for f in $produto/src/server.js $(ls $produto/src/core/*.js $produto/src/lib/*.js $produto/src/scrapers/*.js $produto/src/routes/*.js); do
              node -c "$f"
            done
          done

      - name: sintaxe do plugin
        run: |
          set -e
          for f in $(find plugin/src -name '*.js') plugin/build.js plugin/teste.js; do
            node -c "$f"
          done

      - name: sintaxe dos workers (sao modulos ESM, entao o Node CommonJS nao le)
        # `worker-borda.mjs` ja e' ESM pela extensao, entao o `node --check` direto nele
        # funciona. O `worker-simple.js` e' ESM DENTRO de um `.js`, entao precisa da copia
        # para `.mjs` — foi por isso que este passo existe: a primeira versao do arquivo
        # passou `worker-simple.js` direto no `node -c` e a CI caiu com SyntaxError.
        run: |
          set -e
          cp worker-simple.js /tmp/worker-check.mjs
          node --check /tmp/worker-check.mjs
          rm -f /tmp/worker-check.mjs
          node --check worker-borda.mjs

      # As tres barreiras. A do repo cobre o que e' dos TRES produtos (worker, segredos,
      # e o teste que sobe cada servidor de verdade).
      - name: barra do repo
        run: node --test test/

      - name: barra do MirrorStream
        run: node --test mirrorstream/test/

      - name: barra do MirrorView
        run: node --test mirrorview/test/

      - name: o plugin ainda constroi (11 bundles + manifesto)
        run: |
          npm ci --no-audit --no-fund
          node build.js
        working-directory: plugin

      - name: confere que nenhum teste foi removido
        # A barreira subiu a cada decisao (191 -> 193 -> 198 -> 201 -> 202 -> 204 -> 224 -> 225 -> 232 -> 259 -> 285). Um teste que
        # "sumiu" para a build passar e o jeito mais facil de perder regra sem ninguem ver.
        # 02/10/2026 (2a rodada): 279 -> 286, com o `test/workflows.test.js` novo (7 testes
        # que pegam o fechamento de bloco colado que derrubou a publicacao, e o caminho
        # absoluto que quebrava SO na CI). Antes disso, 285 -> 279: TV saiu do PLUGIN
        # (decisao do dono) e os 15 testes das 4 fontes de TV foram para a pasta do
        # MirrorView em vez de sumir.
        run: |
          ms=$(node --test mirrorstream/test/ 2>&1 | grep -E "^# tests" | awk '{print $3}')
          mv=$(node --test mirrorview/test/ 2>&1 | grep -E "^# tests" | awk '{print $3}')
          repo=$(node --test test/ 2>&1 | grep -E "^# tests" | awk '{print $3}')
          total=$((ms + mv + repo))
          echo "mirrorstream: $ms | mirrorview: $mv | repo: $repo | total: $total"
          if [ "$total" -lt 331 ]; then
            echo "a barra de testes caiu (esperado 331 ou mais)"
            exit 1
          fi
